<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#6366f1" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Background ambient glow -->
  <circle cx="256" cy="256" r="160" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>

  <!-- Modern stylized dumbbell -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)" filter="url(#glow)">
    <!-- Central bar -->
    <rect x="156" y="240" width="200" height="32" rx="16" fill="url(#glowGrad)"/>
    <rect x="220" y="238" width="72" height="36" rx="8" fill="#ffffff" opacity="0.25"/>

    <!-- Left weight plates -->
    <rect x="120" y="196" width="28" height="120" rx="14" fill="url(#accentGrad)"/>
    <rect x="76" y="212" width="36" height="88" rx="12" fill="url(#accentGrad)" opacity="0.85"/>
    <rect x="48" y="228" width="20" height="56" rx="8" fill="url(#accentGrad)" opacity="0.6"/>

    <!-- Right weight plates -->
    <rect x="364" y="196" width="28" height="120" rx="14" fill="url(#accentGrad)"/>
    <rect x="400" y="212" width="36" height="88" rx="12" fill="url(#accentGrad)" opacity="0.85"/>
    <rect x="444" y="228" width="20" height="56" rx="8" fill="url(#accentGrad)" opacity="0.6"/>

    <!-- Plate accents/highlights -->
    <line x1="134" y1="210" x2="134" y2="302" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <line x1="378" y1="210" x2="378" y2="302" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>
